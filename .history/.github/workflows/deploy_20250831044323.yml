name: Deploy (main)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    outputs:
      origin: ${{ steps.worker.outputs.origin || steps.origin.outputs.origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: npm install -g wrangler@3
      - name: Resolve frontend origin (fallback)
        id: origin
        run: echo "origin=${{ secrets.REACT_APP_API_ORIGIN }}" >> "$GITHUB_OUTPUT"
      - name: Deploy Worker and capture origin
        id: worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DB_NAME: ${{ secrets.D1_DB_NAME }}
          D1_DB_ID: ${{ secrets.D1_DB_ID }}
        run: |
          set -euo pipefail
          cat > backend/wrangler.toml <<EOF
          name = "deepsight-api"
          main = "worker.js"
          compatibility_date = "2023-10-30"
          EOF
          if [[ -n "${D1_DB_NAME:-}" && -n "${D1_DB_ID:-}" ]]; then
            cat >> backend/wrangler.toml <<EOF
          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_DB_NAME"
          database_id = "$D1_DB_ID"
          EOF
          fi
          out="$(wrangler deploy --config backend/wrangler.toml 2>&1 | tee /dev/stderr)"
          url="$(printf "%s" "$out" | sed -n 's@.*\(https://[A-Za-z0-9.-]*\.workers\.dev\).*@\1@p' | head -n1)"
          if [[ -z "$url" ]]; then
            echo "Could not parse workers.dev URL from deploy output" >&2; exit 1
          fi
          echo "origin=$url" >> "$GITHUB_OUTPUT"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Cache frontend build
        id: cache-frontend-build
        uses: actions/cache@v4
        with:
          path: frontend/build
          key: ${{ runner.os }}-frontend-build-${{ hashFiles('frontend/package-lock.json', 'frontend/src/**/*', 'frontend/public/**/*') }}
      - name: Build frontend
        if: steps.cache-frontend-build.outputs.cache-hit != 'true'
        working-directory: frontend
        env:
          # Use a placeholder that we can safely replace later
          REACT_APP_API_ORIGIN: "__API_ORIGIN_PLACEHOLDER__"
        run: npm run build
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

  deploy-pages:
    runs-on: ubuntu-latest
    needs: [deploy-backend, build-frontend]
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
      - name: Install wrangler
        run: npm install -g wrangler@3
      - name: Replace API origin placeholder
        run: |
          set -euo pipefail
          API_ORIGIN="${{ needs.deploy-backend.outputs.origin }}"
          echo "Replacing placeholder with API origin: $API_ORIGIN"
          # Grep for files containing the placeholder and use xargs to pass them to sed for replacement.
          # This is safer and more efficient than a blind find-and-replace.
          grep -rl '__API_ORIGIN_PLACEHOLDER__' frontend/build/static/js | xargs sed -i "s|__API_ORIGIN_PLACEHOLDER__|$API_ORIGIN|g"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
        run: |
          wrangler pages deploy frontend/build --project-name "$CF_PAGES_PROJECT" --branch main
